<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 470" width="1280" role="img" aria-labelledby="t d">
<title id="t">How the project is organised</title>
<desc id="d">Data flows from the data folder through the R scripts into the outputs folder. run.R runs everything, setup.R installs packages, docs holds methods and checks, tools holds downloads and artwork.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a7cd4"/><stop offset="1" stop-color="#053f8e"/></linearGradient>
<linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2aa7ee" stop-opacity=".6"/><stop offset="1" stop-color="#0a5cb4" stop-opacity=".6"/></linearGradient></defs>
<style>text{font-family:'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;fill:#fff}
.folder{font-family:Consolas,'SF Mono',Menlo,'DejaVu Sans Mono',monospace;font-size:27px;font-weight:600} .role{font-size:16px;fill:#d7f4ff;text-anchor:end}
.path{font-family:Consolas,'SF Mono',Menlo,'DejaVu Sans Mono',monospace;font-size:18px} .note{font-size:15.5px;fill:#d7f4ff}
.pillpath{font-family:Consolas,'SF Mono',Menlo,'DejaVu Sans Mono',monospace;font-size:18px;font-weight:600} .pillnote{font-size:15.5px;fill:#e3f8ff;text-anchor:end}</style>
<rect width="1280" height="470" rx="26" fill="url(#bg)"/>
<path id="t0" d="M400,200 H460" stroke="#bff4ff" stroke-width="6" stroke-linecap="round"/><path id="t1" d="M820,200 H880" stroke="#bff4ff" stroke-width="6" stroke-linecap="round"/><rect x="40" y="28" width="360" height="346" rx="22" fill="url(#card)" stroke="#fff" stroke-opacity=".55" stroke-width="1.5"/><path d="M50,52 Q50,38 66,38 H374 Q390,38 390,52 Q220,78 50,52Z" fill="#fff" opacity=".16"/><text x="66" y="70" class="folder">data/</text><text x="374" y="70" class="role">What goes in</text><text x="66" y="128" class="path">raw/</text><text x="66" y="148" class="note">original files, unchanged</text><text x="66" y="174" class="path">derived/</text><text x="66" y="194" class="note">joined data and results</text><text x="66" y="220" class="path">spatial/</text><text x="66" y="240" class="note">Shapefiles for GIS</text><rect x="460" y="28" width="360" height="346" rx="22" fill="url(#card)" stroke="#fff" stroke-opacity=".55" stroke-width="1.5"/><path d="M470,52 Q470,38 486,38 H794 Q810,38 810,52 Q640,78 470,52Z" fill="#fff" opacity=".16"/><text x="486" y="70" class="folder">R/</text><text x="794" y="70" class="role">What happens</text><text x="486" y="128" class="path">prepare_*.R</text><text x="486" y="148" class="note">read, join, build the sky</text><text x="486" y="174" class="path">analyse_*.R</text><text x="486" y="194" class="note">clocks, genera, heat</text><text x="486" y="220" class="path">fit_aquarium_models.R</text><text x="486" y="240" class="note">whole years held out</text><text x="486" y="266" class="path">check_*.R</text><text x="486" y="286" class="note">totals and exports</text><text x="486" y="312" class="path">plots/</text><text x="486" y="332" class="note">one script per plot</text><rect x="880" y="28" width="360" height="346" rx="22" fill="url(#card)" stroke="#fff" stroke-opacity=".55" stroke-width="1.5"/><path d="M890,52 Q890,38 906,38 H1214 Q1230,38 1230,52 Q1060,78 890,52Z" fill="#fff" opacity=".16"/><text x="906" y="70" class="folder">outputs/</text><text x="1214" y="70" class="role">What comes out</text><text x="906" y="128" class="path">figures/</text><text x="906" y="148" class="note">PNGs at 300 dpi</text><text x="906" y="174" class="path">vector/</text><text x="906" y="194" class="note">SVG copies</text><text x="906" y="220" class="path">tables/</text><text x="906" y="240" class="note">plot values, diagnostics</text><text x="906" y="266" class="path">models/</text><text x="906" y="286" class="note">fitted models</text><text x="906" y="312" class="path">RESULTS.md</text><text x="906" y="332" class="note">the findings in words</text><circle r="5" fill="#fff"><animateMotion dur="2.6s" begin="0.0s" repeatCount="indefinite"><mpath href="#t0"/></animateMotion></circle><circle r="5" fill="#fff"><animateMotion dur="2.6s" begin="-1.3s" repeatCount="indefinite"><mpath href="#t0"/></animateMotion></circle><circle r="5" fill="#fff"><animateMotion dur="2.6s" begin="0.0s" repeatCount="indefinite"><mpath href="#t1"/></animateMotion></circle><circle r="5" fill="#fff"><animateMotion dur="2.6s" begin="-1.3s" repeatCount="indefinite"><mpath href="#t1"/></animateMotion></circle><rect x="40" y="394" width="290" height="50" rx="25" fill="#fff" fill-opacity=".14" stroke="#fff" stroke-opacity=".45"/><text x="64" y="425" class="pillpath">run.R</text><text x="308" y="425" class="pillnote">runs everything</text><rect x="350" y="394" width="290" height="50" rx="25" fill="#fff" fill-opacity=".14" stroke="#fff" stroke-opacity=".45"/><text x="374" y="425" class="pillpath">setup.R</text><text x="618" y="425" class="pillnote">installs packages</text><rect x="660" y="394" width="280" height="50" rx="25" fill="#fff" fill-opacity=".14" stroke="#fff" stroke-opacity=".45"/><text x="684" y="425" class="pillpath">docs/</text><text x="918" y="425" class="pillnote">methods, checks</text><rect x="960" y="394" width="280" height="50" rx="25" fill="#fff" fill-opacity=".14" stroke="#fff" stroke-opacity=".45"/><text x="984" y="425" class="pillpath">tools/</text><text x="1218" y="425" class="pillnote">downloads, artwork</text>
<rect x="1.5" y="1.5" width="1277" height="467" rx="25" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="3"/>
</svg>