<text x="213" y="414" class="head">The year opens the season</text><text x="213" y="456" class="value">R̄ = 0.72</text><text x="213" y="488" class="note">89% of reef-nights fall while the local</text><text x="213" y="513" class="note">sea warms</text><text x="640" y="414" class="head">The Moon narrows the night</text><text x="640" y="456" class="value">R̄ = 0.57</text><text x="640" y="488" class="note">88% in the tropics and 51% beyond them, in</text><text x="640" y="513" class="note">the eight days from full moon</text><text x="1067" y="414" class="head">The Sun sets the hour</text><text x="1067" y="456" class="value">R̄ = 0.90</text><text x="1067" y="488" class="note">Half of all starts come 1.5 to 2.5 hours</text><text x="1067" y="513" class="note">after sunset</text>
