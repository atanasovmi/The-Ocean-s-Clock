<text x='22.91' y='64.75' style='font-size: 15.00px;fill: #53686D; font-family: "Arial";' textLength='616.34px' lengthAdjust='spacingAndGlyphs'>24 of 28 returning colonies  ·  Median shift of 8 minutes earlier after their programmed sunset</text>
<text x='22.91' y='41.11' style='font-size: 32.00px; font-weight: bold;fill: #183139; font-family: "Times New Roman";' textLength='689.28px' lengthAdjust='spacingAndGlyphs'>The same corals tended to start earlier a year later</text>
<text x='22.91' y='492.70' style='font-size: 11.00px;fill: #53686D; font-family: "Arial";' textLength='636.06px' lengthAdjust='spacingAndGlyphs'>Each dot follows one tagged colony across two shifted seasons at Australia's Sea Simulator. Repeated nights use a yearly median.</text>
<text x='22.91' y='507.22' style='font-size: 11.00px;fill: #53686D; font-family: "Arial";' textLength='666.83px' lengthAdjust='spacingAndGlyphs'>Seasons were moved six months and the light cycle four hours. Shared tank conditions prevent isolating the cause of the year difference.</text>
<text x='22.91' y='521.74' style='font-size: 11.00px;fill: #53686D; font-family: "Arial";' textLength='629.39px' lengthAdjust='spacingAndGlyphs'>Source: Koukoumaftsis et al. (2025), supplementary Table S1. Our matched-colony reanalysis uses only tags timed in both years.</text>
