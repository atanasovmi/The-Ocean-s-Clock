<text x='847.52' y='455.68' style='font-size: 11.20px;fill: #172A36; font-family: "Arial";' textLength='151.06px' lengthAdjust='spacingAndGlyphs'>Moon + season + environment</text>
<text x='29.89' y='496.37' style='font-size: 10.00px;fill: #172A36; font-family: "Arial";' textLength='592.59px' lengthAdjust='spacingAndGlyphs'>Calendar model: cyclic lunar and annual terms. Environment adds preceding-seven-day tank temperature, wind, rainfall and solar flux.</text>
<text x='29.89' y='510.77' style='font-size: 10.00px;fill: #172A36; font-family: "Arial";' textLength='523.70px' lengthAdjust='spacingAndGlyphs'>All models use identical dates with complete lagged inputs; none uses measurements from the predicted day or future.</text>
<text x='29.89' y='525.17' style='font-size: 10.00px;fill: #172A36; font-family: "Arial";' textLength='600.97px' lengthAdjust='spacingAndGlyphs'>Left: whole-year bootstrap 95% intervals, conditional on held-out fits. Right: equal-count reliability bins; dashed line is perfect calibration.</text>
<text x='29.89' y='539.57' style='font-size: 10.00px;fill: #172A36; font-family: "Arial";' textLength='546.77px' lengthAdjust='spacingAndGlyphs'>Paired Brier improvement from environment: -0.0033 (95% interval -0.0078 to +0.0006); positive would favour added inputs.</text>
<text x='29.89' y='553.97' style='font-size: 10.00px;fill: #172A36; font-family: "Arial";' textLength='575.41px' lengthAdjust='spacingAndGlyphs'>Source: Sakai et al. (2024). Retrospective validation within one aquarium and the supplied seasonal diary; not a wild-reef forecast.</text>
<text x='29.89' y='62.50' style='font-size: 13.00px;fill: #172A36; font-family: "Arial";' textLength='499.20px' lengthAdjust='spacingAndGlyphs'>1,007 diary dates from 14 years | every prediction is tested on an entirely withheld year</text>
<text x='29.89' y='38.38' style='font-size: 23.00px; font-weight: bold;fill: #172A36; font-family: "Arial";' textLength='550.92px' lengthAdjust='spacingAndGlyphs'>Environmental data added no clear predictive gain</text>
